<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 960" width="460" height="960" style="background:#f1eee9;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,sans-serif">
  <!-- Top App Bar -->
  <rect x="0" y="0" width="460" height="70" fill="#f8f7f5" />
  <line x1="0" y1="70" x2="460" y2="70" stroke="#e6e3dd" stroke-width="1" />
  
  <!-- Hamburger Menu -->
  <g transform="translate(24, 25)">
    <line x1="0" y1="4" x2="24" y2="4" stroke="#0b1f14" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="11" x2="24" y2="11" stroke="#0b1f14" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="18" x2="24" y2="18" stroke="#0b1f14" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Title: Demo Institution -->
  <text x="230" y="42" text-anchor="middle" font-size="19" font-weight="800" fill="#0b1f14" letter-spacing="-0.02em">Demo Institution</text>

  <!-- Notification Bell with red badge 4 -->
  <g transform="translate(410, 24)">
    <path d="M12 2a6 6 0 0 0-6 6v3.586l-.707.707A1 1 0 0 0 6 14h12a1 1 0 0 0 .707-1.707L18 11.586V8a6 6 0 0 0-6-6zM9 16a3 3 0 0 0 6 0H9z" fill="none" stroke="#0b1f14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="16" cy="4" r="7.5" fill="#dc2626" />
    <text x="16" y="8" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff" font-family="monospace">4</text>
  </g>

  <!-- Page Header -->
  <g transform="translate(24, 102)">
    <!-- Bar chart icon -->
    <g transform="translate(0, 2)">
      <rect x="0" y="8" width="3.5" height="12" rx="1" fill="#0d5a47" />
      <rect x="6.5" y="4" width="3.5" height="16" rx="1" fill="#0d5a47" />
      <rect x="13" y="0" width="3.5" height="20" rx="1" fill="#0d5a47" />
      <line x1="-1" y1="20" x2="18" y2="20" stroke="#0d5a47" stroke-width="1.5" stroke-linecap="round" />
    </g>
    <text x="26" y="18" font-size="22" font-weight="900" fill="#0b1f14" letter-spacing="-0.03em">Management Dashboard</text>
    <text x="0" y="42" font-size="13.5" font-weight="500" fill="#6b7a72">Last refreshed 30/9/2026, 12:05:32 PM</text>
  </g>

  <!-- Row 1: STUDENTS (left) & TEACHERS (right) -->
  <!-- Students card -->
  <g transform="translate(24, 180)">
    <rect width="194" height="114" rx="16" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.02))" />
    <text x="18" y="32" font-size="11" font-weight="700" fill="#6b7a72" letter-spacing="0.08em">STUDENTS</text>
    <text x="18" y="70" font-size="28" font-weight="900" fill="#0b1f14" letter-spacing="-0.03em">1,248</text>
    <text x="18" y="94" font-size="12" font-weight="500" fill="#6b7a72">Across 14 grades</text>
  </g>

  <!-- Teachers card -->
  <g transform="translate(242, 180)">
    <rect width="194" height="114" rx="16" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.02))" />
    <text x="18" y="32" font-size="11" font-weight="700" fill="#6b7a72" letter-spacing="0.08em">TEACHERS</text>
    <text x="18" y="70" font-size="28" font-weight="900" fill="#0b1f14" letter-spacing="-0.03em">64</text>
    <text x="18" y="94" font-size="12" font-weight="500" fill="#6b7a72">Active this term</text>
  </g>

  <!-- Row 2: 2026-27 ASSIGNED -->
  <g transform="translate(24, 310)">
    <rect width="412" height="114" rx="16" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.02))" />
    <text x="20" y="32" font-size="11" font-weight="700" fill="#6b7a72" letter-spacing="0.08em">2026-27 ASSIGNED</text>
    <text x="20" y="72" font-size="30" font-weight="900" fill="#0b1f14" letter-spacing="-0.03em">₹1,86,40,000</text>
    <text x="20" y="96" font-size="12.5" font-weight="500" fill="#6b7a72">Total fee assigned</text>
  </g>

  <!-- Row 3: 2026-27 PAID -->
  <g transform="translate(24, 440)">
    <rect width="412" height="114" rx="16" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.02))" />
    <text x="20" y="32" font-size="11" font-weight="700" fill="#6b7a72" letter-spacing="0.08em">2026-27 PAID</text>
    <text x="20" y="72" font-size="30" font-weight="900" fill="#15803d" letter-spacing="-0.03em">₹1,24,85,500</text>
    <text x="20" y="96" font-size="12.5" font-weight="500" fill="#6b7a72">Fee collections · 67% collected</text>
  </g>

  <!-- Row 4: 2026-27 OVERDUE -->
  <g transform="translate(24, 570)">
    <rect width="412" height="114" rx="16" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.02))" />
    <text x="20" y="32" font-size="11" font-weight="700" fill="#6b7a72" letter-spacing="0.08em">2026-27 OVERDUE</text>
    <text x="20" y="72" font-size="30" font-weight="900" fill="#b45309" letter-spacing="-0.03em">₹8,72,000</text>
    <text x="20" y="96" font-size="12.5" font-weight="500" fill="#6b7a72">From 96 students</text>
  </g>

  <!-- Row 5: TODAY'S ATTENDANCE -->
  <g transform="translate(24, 700)">
    <rect width="412" height="114" rx="16" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.02))" />
    <text x="20" y="32" font-size="11" font-weight="700" fill="#6b7a72" letter-spacing="0.08em">TODAY'S ATTENDANCE</text>
    <text x="20" y="72" font-size="30" font-weight="900" fill="#0b1f14" letter-spacing="-0.03em">94.6%</text>
    <text x="20" y="96" font-size="12.5" font-weight="500" fill="#6b7a72">1,181 of 1,248 present</text>
  </g>

  <!-- Row 6: WHATSAPP ALERTS (left) & PENDING LEAVES (right) -->
  <!-- WhatsApp alerts card -->
  <g transform="translate(24, 830)">
    <rect width="194" height="106" rx="16" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.02))" />
    <text x="18" y="28" font-size="10.5" font-weight="700" fill="#6b7a72" letter-spacing="0.08em">WHATSAPP ALERTS</text>
    <text x="18" y="66" font-size="28" font-weight="900" fill="#0b1f14" letter-spacing="-0.03em">342</text>
    <text x="18" y="90" font-size="12" font-weight="500" fill="#6b7a72">Sent to parents today</text>
  </g>

  <!-- Pending leaves card -->
  <g transform="translate(242, 830)">
    <rect width="194" height="106" rx="16" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.02))" />
    <text x="18" y="28" font-size="10.5" font-weight="700" fill="#6b7a72" letter-spacing="0.08em">PENDING LEAVES</text>
    <text x="18" y="66" font-size="28" font-weight="900" fill="#0b1f14" letter-spacing="-0.03em">7</text>
    <text x="18" y="90" font-size="12" font-weight="500" fill="#6b7a72">Awaiting approval</text>
  </g>
</svg>
