<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wallOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="wallGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="wallGrey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="tableTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="steelFlask" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="acerLaptop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skinTone1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c68652"/>
      <stop offset="100%" stop-color="#a46436"/>
    </linearGradient>
    <linearGradient id="skinTone2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d49b6a"/>
      <stop offset="100%" stop-color="#b87d4a"/>
    </linearGradient>
    <linearGradient id="maroonPolo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="blackPolo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="plaidPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#ffffff"/>
      <rect x="0" y="0" width="24" height="12" fill="#dcfce7" opacity="0.8"/>
      <rect x="0" y="0" width="12" height="24" fill="#dcfce7" opacity="0.8"/>
      <line x1="0" y1="6" x2="24" y2="6" stroke="#16a34a" stroke-width="1.5" opacity="0.6"/>
      <line x1="6" y1="0" x2="6" y2="24" stroke="#16a34a" stroke-width="1.5" opacity="0.6"/>
      <line x1="0" y1="18" x2="24" y2="18" stroke="#ca8a04" stroke-width="1" opacity="0.5"/>
      <line x1="18" y1="0" x2="18" y2="24" stroke="#ca8a04" stroke-width="1" opacity="0.5"/>
    </pattern>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b1f14" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- BACKGROUND WALL WITH THREE ACCENT COLOR BLOCKS -->
  <!-- Orange Left Block -->
  <rect x="0" y="0" width="520" height="460" fill="url(#wallOrange)"/>
  <!-- Middle Grey Block with Switchboard -->
  <rect x="520" y="0" width="260" height="460" fill="url(#wallGrey)"/>
  <rect x="610" y="24" width="70" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="628" cy="41" r="3" fill="#64748b"/>
  <circle cx="645" cy="41" r="3" fill="#64748b"/>
  <circle cx="662" cy="41" r="3" fill="#64748b"/>
  <!-- Green Right Block -->
  <rect x="780" y="0" width="410" height="460" fill="url(#wallGreen)"/>
  <!-- White Rightmost Wall with Cartoon Art -->
  <rect x="1190" y="0" width="90" height="460" fill="#fdf4ff"/>
  <circle cx="1235" cy="110" r="30" fill="#fed7aa" opacity="0.6"/>
  <path d="M 1215 170 Q 1240 140 1265 170" fill="#fbcfe8" opacity="0.7"/>

  <!-- OFFICE DESK -->
  <polygon points="0,480 1280,480 1280,720 0,720" fill="url(#tableTop)"/>
  <line x1="0" y1="480" x2="1280" y2="480" stroke="#cbd5e1" stroke-width="3"/>

  <!-- DESK ACCESSORIES -->
  <!-- Stainless steel water bottle 1 -->
  <rect x="448" y="270" width="34" height="170" rx="10" fill="url(#steelFlask)" filter="url(#softShadow)"/>
  <rect x="455" y="255" width="20" height="18" rx="4" fill="#94a3b8"/>

  <!-- Stainless steel water bottle 2 (middle) -->
  <rect x="790" y="315" width="44" height="260" rx="12" fill="url(#steelFlask)" filter="url(#softShadow)"/>
  <rect x="800" y="295" width="24" height="24" rx="5" fill="#64748b"/>

  <!-- Blue smartphone on right table -->
  <rect x="945" y="605" width="150" height="60" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" transform="rotate(-6, 945, 605)" filter="url(#softShadow)"/>
  <rect x="955" y="612" width="130" height="46" rx="6" fill="#0f172a" transform="rotate(-6, 945, 605)"/>

  <!-- Notebook & Pen -->
  <rect x="850" y="505" width="190" height="80" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#softShadow)"/>
  <line x1="865" y1="520" x2="1025" y2="520" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="865" y1="535" x2="1025" y2="535" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="865" y1="550" x2="1025" y2="550" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="865" y1="565" x2="980" y2="565" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- External keyboard -->
  <rect x="465" y="415" width="145" height="42" rx="4" fill="#1e293b"/>

  <!-- LAPTOP 1: White/Silver Laptop in Center -->
  <rect x="575" y="190" width="180" height="120" rx="6" fill="#0f172a" stroke="#e2e8f0" stroke-width="5"/>
  <!-- Code on Screen -->
  <rect x="583" y="198" width="164" height="104" fill="#090d16"/>
  <rect x="590" y="208" width="45" height="4" fill="#38bdf8"/>
  <rect x="640" y="208" width="60" height="4" fill="#a78bfa"/>
  <rect x="598" y="218" width="80" height="4" fill="#4ade80"/>
  <rect x="598" y="228" width="105" height="4" fill="#f43f5e"/>
  <rect x="606" y="238" width="55" height="4" fill="#facc15"/>
  <rect x="598" y="248" width="90" height="4" fill="#94a3b8"/>
  <polygon points="555,310 775,310 790,395 540,395" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>

  <!-- PERSON 1: Left Foreground (Maroon Polo, Acer Gaming Laptop) -->
  <g id="person1">
    <!-- Body / Maroon Polo -->
    <path d="M -40 720 L 50 260 C 110 230 260 270 290 340 C 310 390 330 460 360 520 L 460 620 L 430 720 Z" fill="url(#maroonPolo)"/>
    <path d="M 60 290 C 80 270 140 270 170 300 L 140 370 Z" fill="#881337"/>
    <!-- Head / Neck -->
    <path d="M 85 240 L 95 140 C 95 60 210 50 240 120 C 255 160 245 230 220 260 Z" fill="url(#skinTone1)"/>
    <!-- Hair & Beard -->
    <path d="M 90 120 C 90 40 220 30 245 80 C 250 110 240 140 235 150 C 220 120 180 100 130 110 C 115 125 105 150 100 160 Z" fill="#090d16"/>
    <!-- Ear & Earbud -->
    <path d="M 230 195 C 242 195 248 215 240 230 C 235 240 225 240 220 230 Z" fill="url(#skinTone1)"/>
    <rect x="230" y="200" width="6" height="16" rx="3" fill="#000000"/>
    <circle cx="233" cy="204" r="3" fill="#38bdf8"/>
    <!-- Smartwatch on left wrist -->
    <rect x="270" y="540" width="34" height="24" rx="6" fill="#090d16"/>
    <!-- Hand on table/laptop -->
    <path d="M 460 610 C 490 625 580 655 585 680 C 585 700 500 720 450 720 Z" fill="url(#skinTone1)"/>
  </g>

  <!-- LAPTOP 2: Acer Gaming Laptop (Foreground) -->
  <polygon points="400,640 760,545 790,700 480,720" fill="url(#acerLaptop)" filter="url(#softShadow)"/>
  <!-- Glowing Cyan Keyboard Keys -->
  <polygon points="460,630 670,575 660,670 480,705" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  <rect x="520" y="605" width="20" height="10" fill="#22d3ee" opacity="0.8"/>
  <rect x="550" y="598" width="20" height="10" fill="#22d3ee" opacity="0.8"/>
  <rect x="580" y="590" width="20" height="10" fill="#22d3ee" opacity="0.8"/>
  <rect x="610" y="582" width="20" height="10" fill="#22d3ee" opacity="0.8"/>
  <!-- Open Laptop Lid Back -->
  <polygon points="630,340 780,360 760,545 615,530" fill="#1e293b" stroke="#334155" stroke-width="2"/>

  <!-- PERSON 2: Tech Lead / Middle Speaker (Black Polo, Animated Hand Gesture) -->
  <g id="person2">
    <!-- Torso / Black Polo -->
    <path d="M 230 400 L 260 270 C 290 260 410 260 450 280 L 480 440 L 320 460 Z" fill="url(#blackPolo)"/>
    <!-- Neck & Face -->
    <path d="M 330 260 L 330 180 C 330 120 400 110 440 140 C 470 170 460 230 420 260 Z" fill="url(#skinTone2)"/>
    <!-- Hair & Beard -->
    <path d="M 320 150 C 330 90 420 80 450 110 C 465 130 460 160 455 170 C 440 140 380 120 340 130 Z" fill="#0f172a"/>
    <path d="M 400 215 C 430 215 450 225 445 245 C 440 260 410 265 390 250 Z" fill="#0f172a"/>
    <!-- Animated Right Arm & Hand (Pointing towards screen) -->
    <!-- Arm -->
    <path d="M 425 290 L 530 400 L 585 410 L 515 440 L 415 340 Z" fill="#1e293b"/>
    <!-- Forearm -->
    <path d="M 520 405 L 590 380 L 610 395 L 535 435 Z" fill="url(#skinTone2)"/>
    <!-- Silver kada / bracelet -->
    <rect x="535" y="415" width="8" height="18" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Hand with open fingers gesturing toward screen -->
    <path d="M 590 380 Q 615 350 635 345 Q 640 355 625 370 Q 645 370 640 382 Q 625 388 610 395 Z" fill="url(#skinTone2)"/>
  </g>

  <!-- PERSON 3: Center-Right Developer (Glasses, Looking at screen) -->
  <g id="person3">
    <!-- Torso -->
    <path d="M 850 480 L 830 380 C 850 350 960 360 990 400 L 980 480 Z" fill="#0f172a"/>
    <!-- Neck & Face -->
    <path d="M 865 360 L 870 260 C 870 190 945 190 965 240 C 975 280 960 340 930 360 Z" fill="url(#skinTone1)"/>
    <!-- Hair -->
    <path d="M 855 240 C 865 170 940 160 965 190 C 975 210 970 230 965 240 Z" fill="#090d16"/>
    <!-- Black Eyeglasses -->
    <rect x="870" y="245" width="28" height="18" rx="4" fill="none" stroke="#000000" stroke-width="3"/>
    <rect x="910" y="245" width="28" height="18" rx="4" fill="none" stroke="#000000" stroke-width="3"/>
    <line x1="898" y1="252" x2="910" y2="252" stroke="#000000" stroke-width="3"/>
    <line x1="855" y1="248" x2="870" y2="252" stroke="#000000" stroke-width="2.5"/>
  </g>

  <!-- PERSON 4: Right Foreground (Green Plaid Shirt, Listening intently) -->
  <g id="person4">
    <!-- Body in Green Plaid / Gingham Pattern -->
    <path d="M 890 720 L 920 460 C 960 320 1140 270 1280 340 L 1280 720 Z" fill="url(#plaidPattern)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#softShadow)"/>
    <!-- Head / Profile -->
    <path d="M 940 330 L 965 200 C 970 100 1090 90 1130 160 C 1150 200 1140 280 1100 320 Z" fill="url(#skinTone1)"/>
    <!-- Hair & Beard -->
    <path d="M 950 170 C 960 80 1080 70 1130 110 C 1145 130 1140 170 1135 180 C 1115 150 1050 120 990 135 Z" fill="#090d16"/>
    <path d="M 975 240 C 990 280 1040 290 1060 260 C 1040 250 1010 240 975 240 Z" fill="#090d16"/>
    <!-- Hand resting on table / chin -->
    <path d="M 890 460 C 910 440 940 440 960 470 C 970 490 940 520 910 510 Z" fill="url(#skinTone1)"/>
    <!-- Red sacred thread / kalava on wrist -->
    <line x1="905" y1="450" x2="925" y2="445" stroke="#dc2626" stroke-width="4"/>
    <line x1="905" y1="453" x2="925" y2="448" stroke="#facc15" stroke-width="1.5"/>
  </g>

  <!-- Sleek Top Overlay Tag -->
  <g transform="translate(30, 30)">
    <rect width="280" height="42" rx="21" fill="#0b1f14" fill-opacity="0.85"/>
    <circle cx="24" cy="21" r="7" fill="#2eca8b"/>
    <text x="40" y="26" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="13" letter-spacing="0.05em">
      EDUMOJO ENGINEERING TEAM
    </text>
  </g>

  <!-- Bottom Location & Office Tag -->
  <g transform="translate(30, 650)">
    <rect width="360" height="44" rx="12" fill="#ffffff" fill-opacity="0.95" filter="url(#softShadow)"/>
    <text x="20" y="27" fill="#0b1f14" font-family="'Inter', sans-serif" font-weight="800" font-size="13">
      Webmagiks HQ · Pune, India
    </text>
    <text x="215" y="27" fill="#15803d" font-family="'Inter', sans-serif" font-weight="600" font-size="12">
      (Daily Sprint Review)
    </text>
  </g>
</svg>
